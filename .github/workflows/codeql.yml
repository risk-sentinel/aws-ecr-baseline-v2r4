name: CodeQL

# SAST for the Ruby resource libraries. Modelled on the CodeQL usage in
# risk-sentinel/container-build-sign so the estate runs one analyser.
#
# The controls are declarative, but libraries/ is real Ruby making AWS SDK
# calls, doing regex matching and string interpolation — the parts where an
# injection or a swallowed error actually matters.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 13 * * 1'   # weekly, offset from the daily secret scan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (ruby)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ruby
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:ruby
